name: CI Build

on:
  push:
    # Build-only on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated workflows). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0
